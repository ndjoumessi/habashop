<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3/dist/tabler-icons.min.css">
<style>body{margin:0;background:#07070C;padding:24px;font-family:'Geist',system-ui,-apple-system,sans-serif}</style>
</head><body>
<div style="padding:1rem 0">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;700&display=swap" rel="stylesheet">
<h2 class="sr-only">Feuille d'encaissement multi-paiement du POS HabaShop</h2>
<div style="font-family:'Geist',system-ui,sans-serif;min-height:560px;background:rgba(4,6,12,.55);border-radius:18px;display:flex;align-items:center;justify-content:center;padding:24px">

<div style="width:100%;max-width:420px;background:#121724;border:1px solid rgba(255,255,255,.08);border-radius:18px;padding:20px">

<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px">
<span style="color:#EAEEF6;font-size:16px;font-weight:500">Encaissement</span>
<span style="width:30px;height:30px;border-radius:8px;background:#161C2B;display:flex;align-items:center;justify-content:center;color:#AAB2C4"><i class="ti ti-x" aria-hidden="true"></i></span>
</div>

<div style="background:#0A0C14;border:1px solid rgba(255,176,32,.2);border-radius:12px;padding:16px;text-align:center;margin-bottom:18px">
<div style="color:#868EA2;font-size:11px;letter-spacing:.5px">TOTAL À PAYER</div>
<div style="color:#FFB020;font-size:30px;font-weight:500;margin-top:3px">11 305 FCFA</div>
</div>

<div style="color:#868EA2;font-size:11px;letter-spacing:.5px;margin-bottom:9px">MODE DE PAIEMENT</div>
<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px">
<div style="background:#161C2B;border:1.5px solid #6C47FF;border-radius:11px;padding:11px 8px;text-align:center"><div style="width:30px;height:30px;border-radius:8px;background:rgba(34,199,122,.16);display:flex;align-items:center;justify-content:center;color:#34E19A;margin:0 auto"><i class="ti ti-coins" aria-hidden="true"></i></div><div style="color:#EAEEF6;font-size:12px;font-weight:500;margin-top:6px">Espèces</div></div>
<div style="background:#161C2B;border:1px solid rgba(255,255,255,.08);border-radius:11px;padding:11px 8px;text-align:center"><div style="width:30px;height:30px;border-radius:8px;background:rgba(79,134,240,.18);display:flex;align-items:center;justify-content:center;color:#6FA0F5;margin:0 auto"><i class="ti ti-ripple" aria-hidden="true"></i></div><div style="color:#EAEEF6;font-size:12px;font-weight:500;margin-top:6px">Wave</div></div>
<div style="background:#161C2B;border:1px solid rgba(255,255,255,.08);border-radius:11px;padding:11px 8px;text-align:center"><div style="width:30px;height:30px;border-radius:8px;background:rgba(255,149,0,.18);display:flex;align-items:center;justify-content:center;color:#FF9F45;margin:0 auto"><i class="ti ti-device-mobile" aria-hidden="true"></i></div><div style="color:#EAEEF6;font-size:12px;font-weight:500;margin-top:6px">Orange</div></div>
<div style="background:#161C2B;border:1px solid rgba(255,255,255,.08);border-radius:11px;padding:11px 8px;text-align:center"><div style="width:30px;height:30px;border-radius:8px;background:rgba(255,197,61,.18);display:flex;align-items:center;justify-content:center;color:#FFC53D;margin:0 auto"><i class="ti ti-wallet" aria-hidden="true"></i></div><div style="color:#EAEEF6;font-size:12px;font-weight:500;margin-top:6px">MTN</div></div>
<div style="background:#161C2B;border:1px solid rgba(255,255,255,.08);border-radius:11px;padding:11px 8px;text-align:center"><div style="width:30px;height:30px;border-radius:8px;background:rgba(139,111,255,.18);display:flex;align-items:center;justify-content:center;color:#A991FF;margin:0 auto"><i class="ti ti-credit-card" aria-hidden="true"></i></div><div style="color:#EAEEF6;font-size:12px;font-weight:500;margin-top:6px">Carte</div></div>
<div style="background:#161C2B;border:1px dashed rgba(255,255,255,.14);border-radius:11px;padding:11px 8px;text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center"><div style="color:#868EA2"><i class="ti ti-arrows-split-2" aria-hidden="true"></i></div><div style="color:#868EA2;font-size:12px;font-weight:500;margin-top:6px">Mixte</div></div>
</div>

<div style="color:#868EA2;font-size:11px;letter-spacing:.5px;margin-bottom:9px">MONTANT REÇU</div>
<div style="background:#0A0C14;border:1px solid rgba(255,255,255,.1);border-radius:11px;padding:13px 15px;display:flex;align-items:baseline;justify-content:flex-end;gap:6px;margin-bottom:10px">
<span style="color:#EAEEF6;font-size:24px;font-weight:500">12 000</span><span style="color:#868EA2;font-size:14px">FCFA</span>
</div>
<div style="display:flex;gap:7px;margin-bottom:12px">
<span style="flex:1;text-align:center;background:#161C2B;border:1px solid rgba(255,255,255,.08);border-radius:9px;padding:8px;color:#AAB2C4;font-size:12px">Exact</span>
<span style="flex:1;text-align:center;background:#161C2B;border:1px solid #6C47FF;border-radius:9px;padding:8px;color:#EAEEF6;font-size:12px">12 000</span>
<span style="flex:1;text-align:center;background:#161C2B;border:1px solid rgba(255,255,255,.08);border-radius:9px;padding:8px;color:#AAB2C4;font-size:12px">15 000</span>
<span style="flex:1;text-align:center;background:#161C2B;border:1px solid rgba(255,255,255,.08);border-radius:9px;padding:8px;color:#AAB2C4;font-size:12px">20 000</span>
</div>

<div style="display:flex;justify-content:space-between;align-items:center;background:rgba(34,199,122,.1);border-radius:11px;padding:12px 15px;margin-bottom:16px">
<span style="color:#AAB2C4;font-size:13px">Rendu monnaie</span>
<span style="color:#34E19A;font-size:18px;font-weight:500">695 FCFA</span>
</div>

<button style="width:100%;background:linear-gradient(135deg,#6C47FF,#4F86F0);color:#fff;border:none;border-radius:12px;padding:14px;font-size:15px;font-weight:500;font-family:inherit;display:flex;align-items:center;justify-content:center;gap:8px"><i class="ti ti-check" aria-hidden="true"></i>Valider l'encaissement</button>

</div>
</div>
</div>
</body></html>
