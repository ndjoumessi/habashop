<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport"
    content="width=device-width,initial-scale=1,viewport-fit=cover"/>

  <!-- ─── SEO Principal ─────────────────────── -->
  <title>HabaShop — Logiciel de Gestion Commerciale pour l'Afrique | POS, Stock, RH</title>
  <!-- ⚠️ « N°1 en Afrique francophone » retiré le 2026-08-06 : superlatif invérifiable, et
       il vivait dans la meta description, donc dans le résultat de recherche lui-même. -->
  <meta name="description"
    content="HabaShop est un logiciel SaaS de gestion commerciale pour les boutiques et superettes d'Afrique. Caisse (POS), stock, clients, fournisseurs, RH et rapports. Essai gratuit 14 jours, sans carte bancaire."/>
  <meta name="keywords"
    content="logiciel gestion commerciale Afrique, caisse enregistreuse Sénégal, POS Côte d'Ivoire, gestion stock Mali, ERP Afrique francophone, logiciel boutique Dakar, gestion superette, facturation Afrique, HabaShop"/>
  <meta name="robots" content="index, follow"/>
  <meta name="author" content="HabaShop"/>
  <link rel="canonical" href="%VITE_APP_URL%/"/>

  <!-- ─── Open Graph (Facebook/WhatsApp) ──────── -->
  <meta property="og:type"        content="website"/>
  <meta property="og:site_name"   content="HabaShop"/>
  <meta property="og:title"
    content="HabaShop — Logiciel de Gestion Commerciale pour l'Afrique"/>
  <meta property="og:description"
    content="Gérez votre boutique, superette ou commerce en Afrique avec HabaShop. POS, stock temps réel, clients, RH, rapports. Essai gratuit 14 jours, sans carte bancaire."/>
  <meta property="og:url"         content="%VITE_APP_URL%"/>
  <meta property="og:image"
    content="%VITE_APP_URL%/og-image.webp"/>
  <meta property="og:image:type"   content="image/webp"/>
  <meta property="og:image:width"  content="1200"/>
  <meta property="og:image:height" content="630"/>
  <meta property="og:image:alt"
    content="HabaShop — Dashboard de gestion commerciale"/>
  <meta property="og:locale"      content="fr_SN"/>
  <meta property="og:locale:alternate" content="fr_CI"/>
  <meta property="og:locale:alternate" content="fr_ML"/>
  <meta property="og:locale:alternate" content="fr_BF"/>

  <!-- ─── Twitter Card ────────────────────────── -->
  <meta name="twitter:card"        content="summary_large_image"/>
  <meta name="twitter:site"        content="@habashop"/>
  <meta name="twitter:title"
    content="HabaShop — Gestion Commerciale pour l'Afrique"/>
  <meta name="twitter:description"
    content="Logiciel SaaS de caisse, stock, clients et RH pour les commerces africains. Essai gratuit 14 jours."/>
  <meta name="twitter:image"
    content="%VITE_APP_URL%/og-image.webp"/>

  <!-- ─── Structured Data (JSON-LD) ─────────────
       ⚠️ Le bloc `aggregateRating` (4,8/5 sur 127 avis) a été SUPPRIMÉ le 2026-08-06.
       Il était entièrement fabriqué — la production ne contenait alors aucune vente de
       marchand réel — et c'était la plus lourde des affirmations de la vitrine : Google
       en tire les étoiles affichées dans les résultats de recherche, donc le mensonge
       sortait du site. Ne pas le remettre sans un vrai dispositif d'avis.
       Les prix suivent `landingShared.PLAN_PRICE_XOF` (ils annonçaient 9 900 / 24 900 /
       49 900, une TROISIÈME grille distincte de la vitrine et de la page /pricing). -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "SoftwareApplication",
    "name": "HabaShop",
    "applicationCategory": "BusinessApplication",
    "operatingSystem": "Web, iOS, Android",
    "description": "Logiciel SaaS de gestion commerciale pour les boutiques et superettes en Afrique francophone. POS, gestion de stock, clients, RH et analytics.",
    "url": "%VITE_APP_URL%",
    "screenshot": "%VITE_APP_URL%/og-image.webp",
    "featureList": [
      "Caisse enregistreuse (POS)",
      "Gestion de stock en temps réel",
      "Gestion clients et fidélité",
      "Ressources humaines et paie",
      "Analytics et rapports",
      "Paiement MTN MoMo, Orange Money et PayDunya",
      "Multi-devises (XOF, XAF, EUR, USD, CAD, GBP)"
    ],
    "offers": [
      {
        "@type": "Offer",
        "name": "Starter",
        "price": "8000",
        "priceCurrency": "XOF",
        "description": "Plan de démarrage — essai gratuit 14 jours"
      },
      {
        "@type": "Offer",
        "name": "Business",
        "price": "25000",
        "priceCurrency": "XOF",
        "description": "Plan mensuel pour les commerces en croissance"
      }
    ],
    "creator": {
      "@type": "Organization",
      "name": "HabaShop",
      "url": "%VITE_APP_URL%"
    }
  }
  </script>

  <!-- Organisation (pour Google Knowledge Panel) -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Organization",
    "name": "HabaShop",
    "url": "%VITE_APP_URL%",
    "logo": "%VITE_APP_URL%/favicon.svg",
    "description": "Logiciel de gestion commerciale SaaS pour l'Afrique francophone",
    "foundingDate": "2026",
    "areaServed": "Africa",
    "serviceArea": {
      "@type": "GeoCircle",
      "geoMidpoint": {
        "@type": "GeoCoordinates",
        "latitude": 14.6928,
        "longitude": -17.4467
      }
    },
    "contactPoint": {
      "@type": "ContactPoint",
      "contactType": "customer service",
      "availableLanguage": ["French","English","Spanish","Italian"]
    }
  }
  </script>

  <!-- FAQ Schema (apparaît dans les résultats Google) -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "FAQPage",
    "mainEntity": [
      {
        "@type": "Question",
        "name": "La caisse fonctionne-t-elle sans connexion internet ?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Dans l'application mobile, oui : la vente est enregistrée sur l'appareil et rejouée automatiquement au retour du réseau. Depuis un navigateur, la caisse a besoin de la connexion pour enregistrer une vente."
        }
      },
      {
        "@type": "Question",
        "name": "Comment se passe le paiement de l'abonnement ?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Les 14 premiers jours sont gratuits et ne demandent aucune carte bancaire. Le passage à un plan payant se fait avec notre équipe : les paiements Mobile Money et carte bancaire sont intégrés et en cours d'activation."
        }
      },
      {
        "@type": "Question",
        "name": "Combien coûte HabaShop ?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Le plan Starter coûte 8 000 F CFA par mois, le plan Business 25 000 F CFA par mois, et le plan Enterprise est sur devis. Les 14 jours d'essai valent pour tous les plans."
        }
      },
      {
        "@type": "Question",
        "name": "Puis-je gérer plusieurs boutiques ?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Oui. Un même compte peut être rattaché à plusieurs boutiques, chacune avec ses produits, ses ventes et son équipe. Le sélecteur de boutique apparaît à la connexion."
        }
      },
      {
        "@type": "Question",
        "name": "Comment ajouter mes produits dans HabaShop ?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Un par un depuis l'écran Stock, avec le code-barres saisi, scanné à la douchette ou lu à la caméra. L'import en masse par fichier n'est pas encore disponible."
        }
      }
    ]
  }
  </script>

  <!-- ─── PWA ───────────────────────────────────── -->
  <link rel="manifest" href="/manifest.json"/>
  <meta name="theme-color" content="#6C47FF"/>
  <meta name="color-scheme" content="dark light"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style"
    content="black-translucent"/>
  <meta name="apple-mobile-web-app-title" content="HabaShop"/>
  <link rel="apple-touch-icon" href="/apple-touch-icon.png"/>

  <!-- ─── Performance & polices ────────────────── -->
  <!-- Warm-up de la connexion API (CORS) avant tout fetch -->
  <link rel="preconnect"
    href="https://habashop-production.up.railway.app" crossorigin/>
  <link rel="dns-prefetch"
    href="https://habashop-production.up.railway.app"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <!-- Geist (police UI) = self-hosté via @fontsource-variable/geist (import dans main.tsx).
       Ici seul JetBrains Mono (--mono) est chargé depuis Google Fonts, en asynchrone
       (preload+onload) → non render-blocking. display=swap : fallback puis swap. -->
  <link rel="preload" as="style"
    href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&display=swap"
    onload="this.onload=null;this.rel='stylesheet'"/>
  <noscript>
    <link rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&display=swap"/>
  </noscript>

  <!-- ─── Favicon ──────────────────────────────── -->
  <link rel="icon" type="image/svg+xml" href="/favicon.svg"/>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
