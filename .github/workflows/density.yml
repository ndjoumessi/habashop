name: Densité — table dense

# ─── POURQUOI UN WORKFLOW SÉPARÉ ──────────────────────────────────────────────
# Cette mesure démarre `vite dev` et pilote un navigateur. `paths:` est natif sur un
# WORKFLOW, pas sur un job — un fichier séparé donne donc un vrai filtrage : sur un
# commit hors périmètre, aucun run n'est même créé. C'est ce qui rend la seconde
# direction (« un commit de backend ou de documentation ne le déclenche pas »)
# prouvable par GitHub lui-même, et pas seulement par nous.
#
# ─── CE QUI EST MESURÉ, ET DEPUIS QUAND ───────────────────────────────────────
#   • la table dense de la console Ops           (harnais `/__dev/table`)
#   • la table du Stock, liste et grille          (2026-08-13)
#   • la vignette produit, seule puis dans ses 7 surfaces appelantes
#   • les ÉCRANS COMPLETS `/app/stock` et `/app/pos` — vraie barre latérale, vrai
#     `.page-content`, vraies routes (2026-08-13)
#
# ⚠️ LE FILTRE ÉTAIT UNE LISTE DE 50 CHEMINS ; IL N'EN EST PLUS UNE, et c'est le
# dernier point qui a changé qui l'impose. Tant qu'on ne montait que des composants,
# la fermeture d'imports du harnais bornait honnêtement le périmètre et
# `densityJobScope.test.ts` réconciliait la liste avec le graphe. Un écran complet, lui,
# atteint 224 des 240 fichiers joignables depuis `App.tsx` — MESURÉ. Garder 50 chemins
# aurait revendiqué une précision disparue et raté 174 fichiers EN SILENCE : la classe
# de défaut exacte que cette liste servait à éviter.
#
# ⚠️ CE QUI N'EST TOUJOURS PAS COUVERT, dit plutôt que masqué :
#   • `apps/frontend/index.html` et `public/**` — hors `src/`, jamais mesurés ici ;
#   • le rendu MOBILE (`mobile/`), qui a son propre moteur et aucune mesure de ce type ;
#   • les écrans autres que Stock et POS : ils sont ATTEIGNABLES par le même amorçage
#     (`e2e/dev/ecrans.ts`, ~5 lignes chacun) mais ne sont PAS mesurés aujourd'hui.
#     Le filtre les déclenche pourtant : il est plus large que la mesure, jamais plus
#     étroit. C'est le bon sens de l'erreur.

on:
  push:
    branches: [main]
    paths: &perimetre
      # ⚠️ LE FILTRE A ÉTÉ ÉLARGI LE 2026-08-13, ET C'EST UNE CORRECTION D'HONNÊTETÉ.
      # Il listait 50 fichiers, réconciliés avec la fermeture d'imports du harnais par
      # `densityJobScope.test.ts`. Depuis que la mesure ouvre des ÉCRANS COMPLETS
      # (`e2e/dev/ecrans-density.spec.ts` : `/app/stock`, `/app/pos`), le périmètre
      # RÉELLEMENT mesuré est de 224 fichiers sur les 240 atteignables depuis
      # `App.tsx` — MESURÉ, pas estimé. Une liste de 50 aurait donc revendiqué une
      # précision qu'elle n'a plus, et raté 174 fichiers en silence : exactement la
      # classe de défaut que ce filtre avait été écrit pour éviter.
      #
      # ⚠️ CE N'EST PAS « PLUS DE FILTRE ». Dans un monorepo, l'essentiel des commits
      # touche `apps/backend`, `mobile/`, `docs/` ou `prisma/` : aucun de ceux-là ne
      # démarre de navigateur. La seconde direction reste donc prouvable par GitHub
      # lui-même — c'était la raison d'être du fichier séparé, et elle tient toujours.
      - 'apps/frontend/src/**'
      # L'outillage de la mesure. ⚠️ Le DOSSIER, pas les fichiers : `e2e/dev/` est
      # exclu de la suite de production par structure (cf. `e2e/dev/README.md`), et
      # tout harnais futur y tombera sans qu'on ait à retoucher ce filtre.
      - 'apps/frontend/e2e/dev/**'
      - 'apps/frontend/playwright.density.config.ts'
      - 'apps/frontend/playwright.config.ts'
      - '.github/workflows/density.yml'
  pull_request:
    branches: [main]
    paths: *perimetre

jobs:
  density:
    name: Géométrie réelle — 390 / 1440 / 2560 px
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install (workspaces, depuis la racine)
        run: npm ci
      - name: Install Playwright (chromium)
        run: npx playwright install --with-deps chromium
      # `playwright.density.config.ts` démarre `vite dev` lui-même (`webServer`) : le harnais
      # `/__dev/table` n'existe QUE là (`import.meta.env.DEV`). Aucune authentification —
      # la garde P0 de `/admin` reste intacte, cf. l'en-tête du spec.
      - name: Mesure de densité
        run: npm run e2e:density --workspace=apps/frontend
        timeout-minutes: 8
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: density-report
          path: apps/frontend/test-results/
          retention-days: 7
