name: HabaShop CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '22'

jobs:
  # ─── Tests unitaires backend ─────────────
  unit-tests-backend:
    name: Unit Tests — Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm' # lockfile racine (monorepo workspaces)
      - name: Install (workspaces, depuis la racine)
        run: npm ci
      - name: Prisma generate
        run: npx prisma generate --schema apps/backend/prisma/schema.prisma
      - name: TypeScript check
        working-directory: apps/backend
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint --workspace=apps/backend
      - name: Unit tests
        run: npm run test:unit --workspace=apps/backend
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/test
          JWT_SECRET: test-secret-for-ci-only-not-production
          NODE_ENV: test

  # ─── Tests unitaires frontend ────────────
  unit-tests-frontend:
    name: Unit Tests — Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - name: Install (workspaces, depuis la racine)
        run: npm ci
      - name: TypeScript check
        working-directory: apps/frontend
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint --workspace=apps/frontend
      - name: Unit tests
        run: npm test --workspace=apps/frontend
      - name: Build
        run: npm run build --workspace=apps/frontend
        env:
          VITE_API_URL: https://habashop-production.up.railway.app
      # Une règle de cache SW peut être valide en source et MORTE dans l'artefact (workbox =
      # premier match). Invisible pour tsc, les tests et la revue → on inspecte le sw.js livré.
      - name: Service worker — aucune règle de cache morte
        run: npm run verify:sw-routes --workspace=apps/frontend
      # Tailwind est configuré mais N'ÉMET RIEN (aucune directive `@tailwind` dans index.css) :
      # une classe utilitaire écrite dans un `className` est MORTE tant qu'elle n'est pas écrite
      # à la main. Invisible pour tsc, les tests et la revue — la source est valide, l'artefact
      # est nul. Même famille que la règle SW ci-dessus. La LOGIQUE, elle, est gardée par
      # `src/tests/classesLivrees.test.ts` ; ici on juge le `dist/` livré.
      - name: Classes CSS — aucun jeton écrit mais absent de l'artefact
        run: npm run verify:classes --workspace=apps/frontend
      - name: Bundle size check (< 100KB gzip)
        working-directory: apps/frontend
        run: |
          SIZE=$(find dist/assets -name "index-*.js" -exec gzip -c {} \; | wc -c)
          echo "Bundle gzip size: ${SIZE} bytes"
          if [ "$SIZE" -gt 100000 ]; then
            echo "❌ Bundle trop lourd: ${SIZE} > 100000 bytes"
            exit 1
          fi
          echo "✅ Bundle OK: ${SIZE} bytes"

  # ─── Tests mobile (Expo — HORS workspaces npm) ───
  # ⚠️ `mobile/` a son propre package.json ET son propre package-lock.json : il n'est PAS
  # couvert par le `npm ci` racine des deux jobs ci-dessus. Sans ce job, ses 239 tests ne
  # tournaient que sur la machine de qui pensait à les lancer (#163) — une PR mobile pouvait
  # être VERTE en cassant tout le mobile.
  #
  # ⚠️ Ce qui rend l'absence coûteuse, ce ne sont pas les tests en nombre, ce sont les
  # JUMEAUX : `barcodeShared`, `loyaltyDiscountShared` et `promotionActiveShared` lisent
  # `docs/shared-fixtures/*.json` et n'existent QUE pour rougir quand une règle bouge d'un
  # seul côté. Ce rouge-là n'arrivait jamais — la protection anti-dérive était à sens unique.
  #
  # ⚠️ AUCUN filtre de chemin, délibérément. Restreindre à `mobile/**` rouvrirait le trou
  # qu'on ferme : un changement de fixture partagée vit dans `docs/`, pas dans `mobile/`, et
  # n'aurait donc PAS déclenché le job. MESURÉ : install à froid 28 s, suite 5 s — la taxe
  # sur une PR web ne justifie pas de rendre le verrou borgne.
  #
  # ⚠️ NE PAS intégrer `mobile/` aux workspaces npm pour « simplifier » : la séparation est
  # délibérée (builds EAS, résolution des versions Expo). Le job séparé est la bonne forme.
  unit-tests-mobile:
    name: Unit Tests — Mobile
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4 # complet : les jumeaux lisent ../../../docs/shared-fixtures
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json # lockfile PROPRE, pas celui de la racine
      - name: Install (DANS mobile/, lockfile dédié)
        run: npm ci
      - name: TypeScript check
        run: npx tsc --noEmit
      - name: Unit tests
        run: npm test

  # ─── Sécurité ────────────────────────────
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - name: Install (workspaces, depuis la racine)
        run: npm ci
      - name: Secrets en dur ?
        run: |
          echo "🔍 Scan secrets…"
          FOUND=0
          # Clés API hardcodées (Anthropic / Twilio SID)
          if grep -rnE "sk-ant-api[0-9]{2}|AC[0-9a-f]{30,}" apps/backend/src apps/frontend/src 2>/dev/null; then
            echo "❌ Clé API hardcodée trouvée !"
            FOUND=1
          fi
          # Fallback JWT dangereux (valeur de repli en dur)
          if grep -rnE "habashop-secret-dev|JWT_SECRET *\?\?" apps/backend/src 2>/dev/null; then
            echo "❌ Fallback JWT dangereux !"
            FOUND=1
          fi
          if [ "$FOUND" -eq 1 ]; then exit 1; fi
          echo "✅ Aucun secret en dur détecté"
      - name: Backend npm audit (non bloquant)
        working-directory: apps/backend
        run: npm audit --audit-level=critical
        continue-on-error: true
      - name: Frontend npm audit (non bloquant)
        working-directory: apps/frontend
        run: npm audit --audit-level=critical
        continue-on-error: true

  # ─── Tests d'intégration (API prod, lecture seule) ──
  integration-tests:
    name: Integration Tests (prod, read-only)
    runs-on: ubuntu-latest
    needs: [unit-tests-backend, unit-tests-frontend]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - name: Install (workspaces, depuis la racine)
        run: npm ci
      - name: Integration tests (lecture seule contre la prod)
        run: npm run test:integration --workspace=apps/backend
        timeout-minutes: 5

  # ─── Tests E2E (Playwright vs prod) ──────
  e2e-tests:
    name: E2E Tests (Playwright, prod)
    runs-on: ubuntu-latest
    needs: [unit-tests-backend, unit-tests-frontend]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - name: Install (workspaces, depuis la racine)
        run: npm ci
      - name: Install Playwright (chromium)
        run: npx playwright install --with-deps chromium
      # Pas de step seed / credential DB : les fixtures datées (ventes du jour → donut) sont
      # créées via l'API authentifiée (compte e2e@) dans le setup Playwright. Le repo est
      # PUBLIC → on n'expose AUCUN DATABASE_URL. Fixtures statiques = seed-e2e-tenant.ts (manuel).
      - name: E2E smoke (prod) — ~6 logins, sous la limite 10/15 min
        run: npm run e2e --workspace=apps/frontend
        timeout-minutes: 10
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/frontend/playwright-report/
          retention-days: 7

  # ─── Résumé post-CI (déploiement AUTOMATIQUE sur push main) ──
  # ⚠️ Ce résumé disait le CONTRAIRE jusqu'ici (« déploiement pas automatique, à déclencher
  # manuellement »). C'était faux ET nuisible : `main` auto-déploie sur les DEUX plateformes,
  # donc le geste manuel qu'il conseillait produisait un SECOND déploiement du même commit et
  # brûlait le quota Vercel (free-tier = 100/jour). Mesuré le 2026-07-23 : la prod servait la
  # version neuve 17 s après le push, alors que le `railway up --ci` lancé « pour forcer »
  # était encore en build. Cf. CLAUDE.md § « APRÈS UN MERGE : ne rien lancer ».
  summary:
    name: Résumé déploiement
    runs-on: ubuntu-latest
    needs: [unit-tests-backend, unit-tests-frontend, unit-tests-mobile, security]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Vérifier la santé de la prod
        run: |
          echo "Vérification santé production…"
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            https://habashop-production.up.railway.app/api/health-extended)
          if [ "$STATUS" != "200" ]; then
            echo "⚠️ Health check prod: HTTP $STATUS (déploiement peut-être en attente)"
          else
            echo "✅ Production saine: HTTP $STATUS"
          fi
      - name: Note de déploiement
        run: |
          echo "## ✅ CI réussie" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Le déploiement est **automatique** sur push \`main\` — Railway (back) ET Vercel (front)." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### ⚠️ Ne rien lancer. Vérifier, c'est tout." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**NE PAS** lancer \`railway up --ci\` ni \`vercel --prod\` : le geste manuel produit un" >> $GITHUB_STEP_SUMMARY
          echo "**second** déploiement du même commit et brûle le quota Vercel (free-tier = 100/jour)." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**À vérifier** :" >> $GITHUB_STEP_SUMMARY
          echo "- Back — \`npm run smoke:version --workspace=apps/backend\` (le \`/health\` déployé == version source)." >> $GITHUB_STEP_SUMMARY
          echo "  ⚠️ Le smoke reste VERT si la version n'a pas bougé : la preuve réelle d'un redémarrage est l'\`uptime\` d'\`/api/health-extended\` remis à zéro." >> $GITHUB_STEP_SUMMARY
          echo "- Front — un déploiement \`● Ready\` **plus récent que le merge** (\`vercel ls --prod\`)." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Item | Valeur |" >> $GITHUB_STEP_SUMMARY
          echo "|------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Auteur | ${{ github.actor }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Frontend | https://habashop.vercel.app |" >> $GITHUB_STEP_SUMMARY
          echo "| Backend | https://habashop-production.up.railway.app |" >> $GITHUB_STEP_SUMMARY

  # ─── Notification d'échec (Discord, optionnel) ──
  notify-failure:
    name: Notify on failure
    runs-on: ubuntu-latest
    needs: [unit-tests-backend, unit-tests-frontend, unit-tests-mobile]
    if: failure()
    steps:
      - name: Alerte Discord
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          if [ -z "$DISCORD_WEBHOOK" ]; then echo "DISCORD_WEBHOOK absent — skip"; exit 0; fi
          curl -X POST "$DISCORD_WEBHOOK" -H "Content-Type: application/json" -d '{
            "embeds": [{
              "title": "❌ HabaShop CI Failed",
              "description": "Branch: ${{ github.ref_name }}\nCommit: ${{ github.sha }}\nAuthor: ${{ github.actor }}",
              "color": 16711680,
              "url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            }]
          }'
