name: HabaShop CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '20'

jobs:
  # ─── Backend : typecheck + tests ─────────
  backend:
    name: Backend (typecheck + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm' # lockfile racine (monorepo workspaces)
      - name: Install (workspaces, depuis la racine)
        run: npm ci
      - name: Prisma generate
        run: npx prisma generate --schema apps/backend/prisma/schema.prisma
      - name: TypeScript check
        working-directory: apps/backend
        run: npx tsc --noEmit
      - name: Tests
        run: npm test --workspace=apps/backend
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/test
          JWT_SECRET: test-secret-for-ci-only-not-production

  # ─── Frontend : typecheck + tests + build ─
  frontend:
    name: Frontend (typecheck + tests + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - name: Install (workspaces, depuis la racine)
        run: npm ci
      - name: TypeScript check
        working-directory: apps/frontend
        run: npx tsc --noEmit
      - name: Tests
        run: npm test --workspace=apps/frontend
      - name: Build
        run: npm run build --workspace=apps/frontend
        env:
          VITE_API_URL: https://habashop-production.up.railway.app

  # ─── Sécurité ────────────────────────────
  security:
    name: Security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: npm audit (non bloquant)
        run: npm audit --audit-level=high
        continue-on-error: true
      - name: Secrets en dur ?
        run: |
          echo "Recherche de secrets en dur dans le code source…"
          if grep -rnE "sk-ant-api[0-9]{2}|AC[0-9a-f]{30,}" apps/backend/src apps/frontend/src 2>/dev/null; then
            echo "⚠️  Secret potentiel détecté dans le code source !"
            exit 1
          fi
          echo "✅ Aucun secret en dur détecté"

  # ─── Résumé post-CI (déploiement MANUEL) ──
  summary:
    name: Résumé déploiement
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Note de déploiement
        run: |
          echo "## ✅ CI réussie" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "⚠️ Le déploiement n'est **pas** automatique sur push — à déclencher manuellement :" >> $GITHUB_STEP_SUMMARY
          echo "- Backend (Railway) : \`cd apps/backend && railway up\`" >> $GITHUB_STEP_SUMMARY
          echo "- Frontend (Vercel) : \`cd apps/frontend && vercel --prod\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Commit : ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- Auteur : ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "- Frontend : https://habashop.vercel.app" >> $GITHUB_STEP_SUMMARY
          echo "- Backend : https://habashop-production.up.railway.app" >> $GITHUB_STEP_SUMMARY
