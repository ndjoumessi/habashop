name: HabaShop CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '22'

jobs:
  # ─── Tests unitaires backend ─────────────
  unit-tests-backend:
    name: Unit Tests — Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm' # lockfile racine (monorepo workspaces)
      - name: Install (workspaces, depuis la racine)
        run: npm ci
      - name: Prisma generate
        run: npx prisma generate --schema apps/backend/prisma/schema.prisma
      - name: TypeScript check
        working-directory: apps/backend
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint --workspace=apps/backend
      - name: Unit tests
        run: npm run test:unit --workspace=apps/backend
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/test
          JWT_SECRET: test-secret-for-ci-only-not-production
          NODE_ENV: test

  # ─── Tests unitaires frontend ────────────
  unit-tests-frontend:
    name: Unit Tests — Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - name: Install (workspaces, depuis la racine)
        run: npm ci
      - name: TypeScript check
        working-directory: apps/frontend
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint --workspace=apps/frontend
      - name: Unit tests
        run: npm test --workspace=apps/frontend
      - name: Build
        run: npm run build --workspace=apps/frontend
        env:
          VITE_API_URL: https://habashop-production.up.railway.app
      - name: Bundle size check (< 100KB gzip)
        working-directory: apps/frontend
        run: |
          SIZE=$(find dist/assets -name "index-*.js" -exec gzip -c {} \; | wc -c)
          echo "Bundle gzip size: ${SIZE} bytes"
          if [ "$SIZE" -gt 100000 ]; then
            echo "❌ Bundle trop lourd: ${SIZE} > 100000 bytes"
            exit 1
          fi
          echo "✅ Bundle OK: ${SIZE} bytes"

  # ─── Sécurité ────────────────────────────
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - name: Install (workspaces, depuis la racine)
        run: npm ci
      - name: Secrets en dur ?
        run: |
          echo "🔍 Scan secrets…"
          FOUND=0
          # Clés API hardcodées (Anthropic / Twilio SID)
          if grep -rnE "sk-ant-api[0-9]{2}|AC[0-9a-f]{30,}" apps/backend/src apps/frontend/src 2>/dev/null; then
            echo "❌ Clé API hardcodée trouvée !"
            FOUND=1
          fi
          # Fallback JWT dangereux (valeur de repli en dur)
          if grep -rnE "habashop-secret-dev|JWT_SECRET *\?\?" apps/backend/src 2>/dev/null; then
            echo "❌ Fallback JWT dangereux !"
            FOUND=1
          fi
          if [ "$FOUND" -eq 1 ]; then exit 1; fi
          echo "✅ Aucun secret en dur détecté"
      - name: Backend npm audit (non bloquant)
        working-directory: apps/backend
        run: npm audit --audit-level=critical
        continue-on-error: true
      - name: Frontend npm audit (non bloquant)
        working-directory: apps/frontend
        run: npm audit --audit-level=critical
        continue-on-error: true

  # ─── Tests d'intégration (API prod, lecture seule) ──
  integration-tests:
    name: Integration Tests (prod, read-only)
    runs-on: ubuntu-latest
    needs: [unit-tests-backend, unit-tests-frontend]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - name: Install (workspaces, depuis la racine)
        run: npm ci
      - name: Integration tests (lecture seule contre la prod)
        run: npm run test:integration --workspace=apps/backend
        timeout-minutes: 5

  # ─── Tests E2E (Playwright vs prod) ──────
  e2e-tests:
    name: E2E Tests (Playwright, prod)
    runs-on: ubuntu-latest
    needs: [unit-tests-backend, unit-tests-frontend]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - name: Install (workspaces, depuis la racine)
        run: npm ci
      - name: Install Playwright (chromium)
        run: npx playwright install --with-deps chromium
      # Pas de step seed / credential DB : les fixtures datées (ventes du jour → donut) sont
      # créées via l'API authentifiée (compte e2e@) dans le setup Playwright. Le repo est
      # PUBLIC → on n'expose AUCUN DATABASE_URL. Fixtures statiques = seed-e2e-tenant.ts (manuel).
      - name: E2E smoke (prod) — ~6 logins, sous la limite 10/15 min
        run: npm run e2e --workspace=apps/frontend
        timeout-minutes: 10
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/frontend/playwright-report/
          retention-days: 7

  # ─── Résumé post-CI (déploiement MANUEL) ──
  summary:
    name: Résumé déploiement
    runs-on: ubuntu-latest
    needs: [unit-tests-backend, unit-tests-frontend, security]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Vérifier la santé de la prod
        run: |
          echo "Vérification santé production…"
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            https://habashop-production.up.railway.app/api/health-extended)
          if [ "$STATUS" != "200" ]; then
            echo "⚠️ Health check prod: HTTP $STATUS (déploiement peut-être en attente)"
          else
            echo "✅ Production saine: HTTP $STATUS"
          fi
      - name: Note de déploiement
        run: |
          echo "## ✅ CI réussie" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "⚠️ Le déploiement n'est **pas** automatique sur push — à déclencher manuellement :" >> $GITHUB_STEP_SUMMARY
          echo "- Backend (Railway) : \`cd apps/backend && railway up --ci\`" >> $GITHUB_STEP_SUMMARY
          echo "- Frontend (Vercel) : \`cd apps/frontend && vercel --prod\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Item | Valeur |" >> $GITHUB_STEP_SUMMARY
          echo "|------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Auteur | ${{ github.actor }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Frontend | https://habashop.vercel.app |" >> $GITHUB_STEP_SUMMARY
          echo "| Backend | https://habashop-production.up.railway.app |" >> $GITHUB_STEP_SUMMARY

  # ─── Notification d'échec (Discord, optionnel) ──
  notify-failure:
    name: Notify on failure
    runs-on: ubuntu-latest
    needs: [unit-tests-backend, unit-tests-frontend]
    if: failure()
    steps:
      - name: Alerte Discord
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          if [ -z "$DISCORD_WEBHOOK" ]; then echo "DISCORD_WEBHOOK absent — skip"; exit 0; fi
          curl -X POST "$DISCORD_WEBHOOK" -H "Content-Type: application/json" -d '{
            "embeds": [{
              "title": "❌ HabaShop CI Failed",
              "description": "Branch: ${{ github.ref_name }}\nCommit: ${{ github.sha }}\nAuthor: ${{ github.actor }}",
              "color": 16711680,
              "url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            }]
          }'
